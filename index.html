<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Influencer Collector</title>
<style>
*{box-sizing:border-box}
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}
body{margin:0;min-height:100vh;background:#f6f7fb}
.wrap{max-width:1100px;height:100vh;margin:auto;padding:18px 20px;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex:0 0 auto}
.brand{font-size:20px;font-weight:750;letter-spacing:-.02em}
.count{font-size:13px;color:#667085;background:#fff;border:1px solid #e6e8ee;padding:7px 10px;border-radius:999px}
.card{background:#fff;border:1px solid #e6e8ee;border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(16,24,40,.05);flex:1;min-height:0;display:flex;flex-direction:column}
h3{font-size:15px;margin:0 0 10px}
.muted{color:#667085;font-size:14px}
.drop{display:flex;align-items:center;gap:14px;margin-top:2px;border:1.5px dashed #c9ced8;border-radius:14px;padding:16px 18px;cursor:pointer;background:#fbfcfe;transition:.15s}
.drop:hover{border-color:#98a2b3;background:#f8fafc}
.upload-icon{width:40px;height:40px;border-radius:11px;background:#eef2ff;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.drop strong{display:block;font-size:14px;margin-bottom:2px}.upload-hint{display:block;font-size:12px;color:#98a2b3}
input[type=file]{display:none}
.preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;min-height:0;max-height:92px;overflow:hidden}
.thumb{position:relative;width:62px;height:82px}
.thumb img{width:62px;height:82px;object-fit:cover;border-radius:8px;border:1px solid #e6e8ee}
.actions{display:flex;gap:8px;margin-top:8px;align-items:center;flex:0 0 auto}
.push-area{display:flex;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid #eef0f3;flex:0 0 auto}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:650;font-size:14px;cursor:pointer;background:#111827;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:#eef1f5;color:#344054}
.status{margin-top:7px;font-size:12px;color:#667085;min-height:16px;flex:0 0 auto}
.results{margin-top:12px;min-height:0;display:flex;flex-direction:column;flex:1}
.results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;flex:0 0 auto}.small{font-size:11px}.push{white-space:nowrap}.result-list{overflow:auto;min-height:0;padding-right:2px}.result-card{background:#fbfcfe;border:1px solid #e6e8ee;border-radius:11px;padding:10px 11px;margin-top:7px}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.result-name{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;color:#667085;background:#f2f4f7;border-radius:999px;padding:5px 8px;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:9px}
.field label{display:block;font-size:11px;font-weight:600;color:#667085;margin-bottom:5px}
.field input{width:100%;padding:7px 9px;border:1px solid #d5d9e1;border-radius:8px;font-size:13px;color:#172033;outline:none}
.field input:focus{border-color:#667085;box-shadow:0 0 0 3px #eef0f4}
.niche{margin-top:7px}
details{margin-top:11px;color:#667085;font-size:12px}
pre{background:#f8fafc;border:1px solid #eef0f3;padding:10px;border-radius:8px;overflow:auto}
.empty{padding:28px;text-align:center;color:#98a2b3;border:1px dashed #d5d9e1;border-radius:12px;margin-top:10px;font-size:13px}
@media(max-width:680px){.wrap{padding:12px;height:100vh}.results-head{align-items:flex-end}.wrap h1{font-size:21px}.row{grid-template-columns:1fr 1fr}.field:nth-child(3){grid-column:1/-1}.card{padding:16px}}
@media(max-width:430px){.row{grid-template-columns:1fr}.field:nth-child(3){grid-column:auto}.drop{padding:16px}.actions .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Influencer Collector</div>
    <div id="count" class="count">0 screenshots</div>
  </div>
  <div class="card">
    <label class="drop" for="files">
      <div class="upload-icon">↑</div>
      <div><strong>Upload</strong><span class="upload-hint">TikTok profile screenshots</span></div>
    </label>
    <input id="files" type="file" accept="image/*" multiple>

    <div id="preview" class="preview"></div>

    <div class="actions">
      <button id="clearBtn" class="btn secondary">Clear</button>
    </div>
    <div id="status" class="status"></div>

    <div class="results">
      <div class="results-head">
        <h3>Influencers</h3>
      </div>
      <div id="results" class="result-list"><div class="empty">Upload a screenshot to start.</div></div>
      <div class="push-area"><button id="pushBtn" class="btn push" disabled>Push to Google Sheets</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const filesEl=document.getElementById('files'), preview=document.getElementById('preview'),
pushBtn=document.getElementById('pushBtn'), clearBtn=document.getElementById('clearBtn'),
status=document.getElementById('status'), results=document.getElementById('results');
let files=[]; const countEl=document.getElementById('count');
const SHEETS_URL='https://script.google.com/macros/s/AKfycbw4_moeKhXsoAsrQz7fruH7R1LJmK7meutEor1pP-U9KqB6NGQrn3nVGH8yEr9mA5wb/exec';

filesEl.onchange=async()=>{
  files=[...filesEl.files];
  renderPreview();
  updateCount();
  if(files.length) await runOCR();
};
function updateCount(){countEl.textContent=`${files.length} screenshot${files.length===1?'':'s'}`;}
function renderPreview(){preview.innerHTML=''; files.forEach(f=>{let u=URL.createObjectURL(f);let d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${u}" alt="">`;preview.appendChild(d);});}
clearBtn.onclick=()=>{files=[];filesEl.value='';preview.innerHTML='';results.innerHTML='<div class="empty">No screenshot processed yet.</div>';status.textContent='';pushBtn.disabled=true; updateCount();};


async function runOCR(){
 if(!files.length)return;
 pushBtn.disabled=true; results.innerHTML='';
 for(let i=0;i<files.length;i++){
   status.textContent=`Running local OCR… ${i+1}/${files.length}`;
   try{
     const {data:{text}}=await Tesseract.recognize(files[i],'eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`OCR ${i+1}/${files.length}: ${Math.round((m.progress||0)*100)}%`; }});
     const extracted=parseTikTokText(text);
     addResult(files[i].name,text,extracted);
   }catch(e){addError(files[i].name,e.message);}
 }
 status.textContent=`Finished ${files.length} screenshot${files.length===1?'':'s'}.`;
 pushBtn.disabled = !results.querySelector('.result-card');
}


pushBtn.onclick=async()=>{
 const cards=[...results.querySelectorAll('.result-card')];
 if(!cards.length)return;
 pushBtn.disabled=true;
 let added=0;
 try{
   for(let i=0;i<cards.length;i++){
     const inputs=cards[i].querySelectorAll('input');
     const payload={username:inputs[0].value.trim(),firstName:inputs[1].value.trim(),email:inputs[2].value.trim(),niche:inputs[3].value.trim()};
     status.textContent=`Pushing ${i+1}/${cards.length} to Google Sheets…`;
     const body=JSON.stringify(payload);
     await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
     added++;
   }
   status.textContent=`Sent ${added} influencer${added===1?'':'s'} to Google Sheets.`;
 }catch(e){
   status.textContent=`Could not push to Google Sheets: ${e.message}`;
 }finally{
   pushBtn.disabled=!results.querySelector('.result-card');
 }
};

function parseTikTokText(text){
 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
 const email=(text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'';
 const handle=(text.match(/@([A-Za-z0-9._-]{2,40})/)||[])[1]||'';
 let display='';
 const hi=lines.findIndex(x=>/@[A-Za-z0-9._-]+/.test(x));
 if(hi>0) display=lines[hi-1];
 let first='';
 if(display){
   const cleaned=display.replace(/[^A-Za-zÀ-ÿ' -]/g,' ').trim();
   const words=cleaned.split(/\s+/).filter(Boolean);
   if(words.length && /^[A-Za-zÀ-ÿ'-]+$/.test(words[0])) first=words[0];
 }
 return {username:handle,displayName:display,firstName:first,email};
}
function addResult(name,text,d){
 const el=document.createElement('div');el.className='result-card';
 el.innerHTML=`<div class="result-head"><div class="result-name">${esc(name)}</div><div class="badge">OCR result</div></div>
 <div class="row">
 <div class="field"><label>Username</label><input value="${escAttr(d.username)}"></div>
 <div class="field"><label>First name</label><input value="${escAttr(d.firstName)}"></div>
 <div class="field"><label>Email</label><input value="${escAttr(d.email)}"></div>
 </div>
 <div class="field niche"><label>Niche</label><input placeholder="e.g. Fashion, Fitness, Beauty" value=""></div>
 <details style="margin-top:14px"><summary>Raw OCR text</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(text)}</pre></details>`;
 results.appendChild(el);
}
function addError(n,e){const el=document.createElement('div');el.className='empty';el.textContent=`${n}: ${e}`;results.appendChild(el);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return esc(s);}
</script>
</body>
</html>
