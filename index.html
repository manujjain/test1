<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Influencer Collector</title>
<style>
*{box-sizing:border-box}
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}
body{margin:0;min-height:100vh;background:#f6f7fb}
.wrap{max-width:1100px;height:100vh;margin:auto;padding:18px 20px;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex:0 0 auto}
.brand{font-size:20px;font-weight:750;letter-spacing:-.02em}.top-actions{display:flex;align-items:center;gap:8px}
.count{font-size:13px;color:#667085;background:#fff;border:1px solid #e6e8ee;padding:7px 10px;border-radius:999px}
.icon-btn{border:1px solid #e6e8ee;background:#fff;color:#667085;border-radius:9px;padding:7px 9px;cursor:pointer;font-size:14px}.icon-btn:hover{background:#f8fafc}
.card{background:#fff;border:1px solid #e6e8ee;border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(16,24,40,.05);flex:1;min-height:0;display:flex;flex-direction:column}
h3{font-size:15px;margin:0 0 10px}.muted{color:#667085;font-size:14px}
.drop{display:flex;align-items:center;gap:14px;margin-top:2px;border:1.5px dashed #c9ced8;border-radius:14px;padding:16px 18px;cursor:pointer;background:#fbfcfe;transition:.15s}.drop:hover{border-color:#98a2b3;background:#f8fafc}
.upload-icon{width:40px;height:40px;border-radius:11px;background:#eef2ff;display:grid;place-items:center;font-size:20px;flex:0 0 auto}.drop strong{display:block;font-size:14px;margin-bottom:2px}.upload-hint{display:block;font-size:12px;color:#98a2b3}
input[type=file]{display:none}.preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;min-height:0;max-height:92px;overflow:hidden}.thumb{position:relative;width:62px;height:82px}.thumb img{width:62px;height:82px;object-fit:cover;border-radius:8px;border:1px solid #e6e8ee}
.actions{display:flex;gap:8px;margin-top:8px;align-items:center;flex:0 0 auto}.status{min-height:18px;margin-top:6px;font-size:12px;color:#667085}
.push-area{display:flex;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid #eef0f3;flex:0 0 auto}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:650;font-size:14px;cursor:pointer;background:#111827;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#f2f4f7;color:#344054}.push{white-space:nowrap}
.results{display:flex;flex-direction:column;min-height:0;flex:1;margin-top:10px}.results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;flex:0 0 auto}.small{font-size:11px}.result-list{overflow:auto;min-height:0;padding-right:2px}.result-card{background:#fbfcfe;border:1px solid #e6e8ee;border-radius:11px;padding:10px 11px;margin-top:7px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}.result-name{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:11px;color:#667085;background:#f2f4f7;border-radius:999px;padding:5px 8px;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:9px}.field label{display:block;font-size:11px;font-weight:600;color:#667085;margin-bottom:5px}.field input{width:100%;padding:7px 9px;border:1px solid #d5d9e1;border-radius:8px;font-size:13px;color:#172033;outline:none}.field input:focus{border-color:#667085;box-shadow:0 0 0 3px #eef0f4}.niche{margin-top:7px}details{margin-top:11px;color:#667085;font-size:12px}pre{background:#f8fafc;border:1px solid #eef0f3;padding:10px;border-radius:8px;overflow:auto}.empty{padding:28px;text-align:center;color:#98a2b3;border:1px dashed #d5d9e1;border-radius:12px;margin-top:10px;font-size:13px}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(460px,100%);background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(16,24,40,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-title{font-size:16px;font-weight:700}.close{border:0;background:transparent;font-size:22px;color:#667085;cursor:pointer}.modal label{display:block;font-size:12px;font-weight:650;color:#475467;margin-bottom:6px}.modal input{width:100%;padding:10px;border:1px solid #d5d9e1;border-radius:9px;font-size:13px}.modal-note{font-size:11px;line-height:1.5;color:#667085;margin-top:9px}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.saved{font-size:11px;color:#027a48;align-self:center}
@media(max-width:680px){.wrap{padding:12px;height:100vh}.results-head{align-items:flex-end}.wrap h1{font-size:21px}.row{grid-template-columns:1fr 1fr}.field:nth-child(3){grid-column:1/-1}.card{padding:16px}}
@media(max-width:430px){.row{grid-template-columns:1fr}.field:nth-child(3){grid-column:auto}.drop{padding:16px}.actions .btn{flex:1}.brand{font-size:18px}.top-actions{gap:5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Influencer Collector</div>
    <div class="top-actions">
      <div id="count" class="count">0 screenshots</div>
      <button id="settingsBtn" class="icon-btn" title="Gemini settings">⚙</button>
    </div>
  </div>
  <div class="card">
    <label class="drop" for="files">
      <div class="upload-icon">↑</div>
      <div><strong>Upload</strong><span class="upload-hint">TikTok profile screenshots</span></div>
    </label>
    <input id="files" type="file" accept="image/*">
    <div id="preview" class="preview"></div>
    <div class="actions"><button id="clearBtn" class="btn secondary">Clear</button></div>
    <div id="status" class="status"></div>
    <div class="results">
      <div class="results-head"><h3>Influencers</h3></div>
      <div id="results" class="result-list"><div class="empty">Upload a screenshot to start.</div></div>
      <div class="push-area"><button id="pushBtn" class="btn push" disabled>Push to Google Sheets</button></div>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">Gemini API</div><button id="closeSettings" class="close">×</button></div>
    <label for="apiKeyInput">API key</label>
    <input id="apiKeyInput" type="password" placeholder="Paste your Gemini API key">
    <div class="modal-note">The key is saved only in this browser's local storage. It is not embedded in this HTML file. For a public production app, use a backend proxy instead.</div>
    <div class="modal-actions"><button id="clearKeyBtn" class="btn secondary">Clear key</button><div class="saved" id="keyStatus"></div><button id="saveKeyBtn" class="btn">Save</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const filesEl=document.getElementById('files'), preview=document.getElementById('preview'),
pushBtn=document.getElementById('pushBtn'), clearBtn=document.getElementById('clearBtn'),
status=document.getElementById('status'), results=document.getElementById('results'), countEl=document.getElementById('count');
const settingsBtn=document.getElementById('settingsBtn'), settingsModal=document.getElementById('settingsModal'),
closeSettings=document.getElementById('closeSettings'), apiKeyInput=document.getElementById('apiKeyInput'),
saveKeyBtn=document.getElementById('saveKeyBtn'), clearKeyBtn=document.getElementById('clearKeyBtn'), keyStatus=document.getElementById('keyStatus');
let files=[];
const SHEETS_URL='https://script.google.com/macros/s/AKfycbw4_moeKhXsoAsrQz7fruH7R1LJmK7meutEor1pP-U9KqB6NGQrn3nVGH8yEr9mA5wb/exec';
const GEMINI_MODEL='gemini-3.6-flash';
const GEMINI_URL='https://generativelanguage.googleapis.com/v1beta/interactions';
function getApiKey(){return localStorage.getItem('influencer_collector_gemini_key')||'';}
function openSettings(){apiKeyInput.value=getApiKey();keyStatus.textContent=getApiKey()?'Key saved in this browser':'';settingsModal.classList.add('open');setTimeout(()=>apiKeyInput.focus(),30);}
function closeModal(){settingsModal.classList.remove('open');}
settingsBtn.onclick=openSettings; closeSettings.onclick=closeModal; settingsModal.onclick=e=>{if(e.target===settingsModal)closeModal();};
saveKeyBtn.onclick=()=>{const k=apiKeyInput.value.trim();if(k)localStorage.setItem('influencer_collector_gemini_key',k);else localStorage.removeItem('influencer_collector_gemini_key');keyStatus.textContent=k?'Saved':'Cleared';closeModal();};
clearKeyBtn.onclick=()=>{localStorage.removeItem('influencer_collector_gemini_key');apiKeyInput.value='';keyStatus.textContent='Cleared';};

filesEl.onchange=async()=>{files=[...filesEl.files].slice(0,1);renderPreview();updateCount();if(files.length)await runOCRAndAI();};
function updateCount(){countEl.textContent=`${files.length} screenshot${files.length===1?'':'s'}`;}
function renderPreview(){preview.innerHTML='';files.forEach(f=>{const u=URL.createObjectURL(f),d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${u}" alt="">`;preview.appendChild(d);});}
clearBtn.onclick=()=>{files=[];filesEl.value='';preview.innerHTML='';results.innerHTML='<div class="empty">No screenshot processed yet.</div>';status.textContent='';pushBtn.disabled=true;updateCount();};

async function runOCRAndAI(){
  pushBtn.disabled=true; results.innerHTML='';
  const apiKey=getApiKey();
  if(!files.length){status.textContent='Upload a screenshot to start.';return;}
  if(!apiKey){
    status.textContent='Add your Gemini API key in ⚙ to process the screenshot.';
    results.innerHTML='<div class="empty">Open ⚙ and save your Gemini API key, then upload the screenshot again.</div>';
    return;
  }
  let worker=null;
  try{
    worker=await Tesseract.createWorker('eng',1,{logger:m=>{
      if(m.status==='recognizing text') status.textContent=`OCR ${Math.round((m.progress||0)*100)}%`;
    }});
    await worker.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'});

    const file=files[0];
    status.textContent='OCR…';
    const image=await preprocessImage(file);
    const {data}=await worker.recognize(image);

    if(!data.text || !data.text.trim()){
      throw new Error('No readable text was found in the screenshot.');
    }

    status.textContent='AI interpreting…';
    const extracted=await interpretWithGemini(data.text,apiKey);
    addResult(file.name,data.text,extracted);
    status.textContent='Done — review the extracted details below.';
    pushBtn.disabled=false;
  }catch(e){
    addError(files[0]?.name||'Processing',e.message||String(e));
    status.textContent='Processing failed.';
  }finally{
    if(worker) await worker.terminate();
  }
}

function preprocessImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);const scale=Math.min(2.5,Math.max(1.5,1800/Math.max(img.width,img.height)));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,canvas.width,canvas.height);const data=ctx.getImageData(0,0,canvas.width,canvas.height),px=data.data;for(let i=0;i<px.length;i+=4){let g=.299*px[i]+.587*px[i+1]+.114*px[i+2];g=((g-128)*1.35)+128;g=Math.max(0,Math.min(255,g));px[i]=px[i+1]=px[i+2]=g;}ctx.putImageData(data,0,0);resolve(canvas);};img.onerror=reject;img.src=url;});}

async function interpretWithGemini(ocrText,apiKey){
  const prompt=`Extract data from the COMPLETE OCR text of ONE TikTok profile screenshot.
Return only the three requested fields.
Rules:
- username: the TikTok handle explicitly shown in the profile. Prefer the @handle. Return it with @. If uncertain, return an empty string.
- firstName: only a clearly supported first name from the person's display name. Never guess from username, email, bio, niche, initials, or location. If uncertain, return an empty string.
- email: only an email explicitly present in the OCR. Fix obvious OCR spacing around @ or dots when clearly recoverable. Otherwise return an empty string.
Consider ALL OCR text and its line relationships. Ignore unrelated UI text.

COMPLETE OCR TEXT:
---
${ocrText}
---`;

  const body={
    model:GEMINI_MODEL,
    input:prompt,
    store:false,
    generation_config:{max_output_tokens:120}
  };

  if(location.protocol==='file:'){
    throw new Error('Open the app from GitHub Pages before using Gemini.');
  }

  // Use the same authentication style that was verified successfully in PowerShell.
  // The API key is kept in browser localStorage and is never embedded in this HTML.
  const url=`${GEMINI_URL}?key=${encodeURIComponent(apiKey)}`;
  const r=await fetch(url,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Api-Revision':'2026-05-20'
    },
    body:JSON.stringify({
      ...body,
      response_format:{
        type:'text',
        mime_type:'application/json',
        schema:{
          type:'object',
          properties:{
            username:{type:'string'},
            firstName:{type:'string'},
            email:{type:'string'}
          },
          required:['username','firstName','email']
        }
      }
    })
  });

  if(!r.ok){
    let msg=`Gemini request failed (${r.status})`;
    try{const e=await r.json();msg=e?.error?.message||msg;}catch{}
    throw new Error(msg);
  }

  const j=await r.json();
  if(j?.status && j.status!=='completed') throw new Error(`Gemini interaction status: ${j.status}`);

  let text=String(j?.output_text||'').trim();
  if(!text && Array.isArray(j?.steps)){
    for(const step of j.steps){
      if(step?.type!=='model_output' || !Array.isArray(step.content)) continue;
      for(const part of step.content){
        if(typeof part==='string') text+=part;
        else if(typeof part?.text==='string') text+=part.text;
      }
    }
    text=text.trim();
  }
  if(!text) throw new Error('Gemini returned no model output.');

  let parsed;
  try{ parsed=JSON.parse(text); }
  catch{
    const match=text.match(/\{[\s\S]*\}/);
    if(match){ try{ parsed=JSON.parse(match[0]); }catch{} }
  }
  if(!parsed || typeof parsed!=='object') throw new Error('Gemini returned invalid structured data.');

  return {
    username:normalizeUsername(parsed.username||''),
    firstName:String(parsed.firstName||'').trim(),
    email:cleanEmail(parsed.email||'')
  };
}
function normalizeUsername(s){let v=String(s||'').trim().replace(/^@+/,'');v=v.replace(/[^A-Za-z0-9._-]/g,'');return v?'@'+v:'';}
function cleanEmail(s){return String(s||'').replace(/\s+/g,'').replace(/[;,]+$/,'');}

function addResult(name,text,d){const el=document.createElement('div');el.className='result-card';el.innerHTML=`<div class="result-head"><div class="result-name">${esc(name)}</div><div class="badge">AI result</div></div><div class="row"><div class="field"><label>Username</label><input value="${escAttr(d.username)}"></div><div class="field"><label>First name</label><input value="${escAttr(d.firstName)}"></div><div class="field"><label>Email</label><input value="${escAttr(d.email)}"></div></div><div class="field niche"><label>Niche</label><input placeholder="e.g. Fashion, Fitness, Beauty" value=""></div><details><summary>Raw OCR text</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(text)}</pre></details>`;results.appendChild(el);}
function addError(n,e){const el=document.createElement('div');el.className='empty';el.textContent=`${n}: ${e}`;results.appendChild(el);}

pushBtn.onclick=async()=>{
  const cards=[...results.querySelectorAll('.result-card')];if(!cards.length)return;
  pushBtn.disabled=true;status.textContent=`Pushing ${cards.length} influencer${cards.length===1?'':'s'}…`;
  let ok=0,fail=0;
  await Promise.all(cards.map(async card=>{const inputs=card.querySelectorAll('input');const payload={username:inputs[0].value.trim(),firstName:inputs[1].value.trim(),email:inputs[2].value.trim(),niche:inputs[3].value.trim()};try{await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)});ok++;}catch{fail++;}}));
  status.textContent=fail?`${ok} sent, ${fail} failed.`:`${ok} sent to Google Sheets.`;pushBtn.disabled=false;
};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function escAttr(s){return esc(s);}
</script>
</body>
</html>
