<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Influencer Collector</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#111827}
.wrap{max-width:760px;margin:auto;padding:28px 18px 50px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 5px 20px #00000008}
h1{font-size:25px;margin:0 0 7px}.muted{color:#6b7280;font-size:14px}.drop{margin-top:20px;border:2px dashed #cbd5e1;border-radius:15px;padding:35px 20px;text-align:center;cursor:pointer;background:#fafafa}
.drop:hover{background:#f8fafc}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:650;cursor:pointer;background:#111827;color:white}.btn.secondary{background:#eef2f7;color:#111827}
input[type=file]{display:none}.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:16px}.thumb{position:relative}.thumb img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;border:1px solid #e5e7eb}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.status{margin-top:16px;font-size:14px}.results{margin-top:22px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font-size:14px}.empty{padding:25px;text-align:center;color:#9ca3af;border:1px dashed #d1d5db;border-radius:12px;margin-top:15px}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:18px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Influencer Collector</h1>
    <div class="muted">Upload TikTok profile screenshots and test local OCR.</div>

    <label class="drop" for="files">
      <strong>Choose TikTok screenshots</strong><br>
      <span class="muted">PNG, JPG or WEBP · multiple files supported</span>
    </label>
    <input id="files" type="file" accept="image/*" multiple>

    <div id="preview" class="preview"></div>

    <div class="actions">
      <button id="ocrBtn" class="btn" disabled>Run local OCR</button>
      <button id="clearBtn" class="btn secondary">Clear</button>
    </div>
    <div id="status" class="status"></div>

    <div class="results">
      <h3>OCR / extracted data</h3>
      <div id="results"><div class="empty">No screenshot processed yet.</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const filesEl=document.getElementById('files'), preview=document.getElementById('preview'),
ocrBtn=document.getElementById('ocrBtn'), clearBtn=document.getElementById('clearBtn'),
status=document.getElementById('status'), results=document.getElementById('results');
let files=[];

filesEl.onchange=()=>{files=[...filesEl.files]; renderPreview(); ocrBtn.disabled=!files.length;};
function renderPreview(){preview.innerHTML=''; files.forEach(f=>{let u=URL.createObjectURL(f);let d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${u}" alt="">`;preview.appendChild(d);});}
clearBtn.onclick=()=>{files=[];filesEl.value='';preview.innerHTML='';results.innerHTML='<div class="empty">No screenshot processed yet.</div>';status.textContent='';ocrBtn.disabled=true;};

ocrBtn.onclick=async()=>{
 if(!files.length)return;
 ocrBtn.disabled=true; results.innerHTML='';
 for(let i=0;i<files.length;i++){
   status.textContent=`Running local OCR… ${i+1}/${files.length}`;
   try{
     const {data:{text}}=await Tesseract.recognize(files[i],'eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`OCR ${i+1}/${files.length}: ${Math.round((m.progress||0)*100)}%`; }});
     const extracted=parseTikTokText(text);
     addResult(files[i].name,text,extracted);
   }catch(e){addError(files[i].name,e.message);}
 }
 status.textContent=`Finished ${files.length} screenshot${files.length===1?'':'s'}.`;
 ocrBtn.disabled=false;
};

function parseTikTokText(text){
 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
 const email=(text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'';
 const handle=(text.match(/@([A-Za-z0-9._-]{2,40})/)||[])[1]||'';
 let display='';
 const hi=lines.findIndex(x=>/@[A-Za-z0-9._-]+/.test(x));
 if(hi>0) display=lines[hi-1];
 let first='';
 if(display){
   const cleaned=display.replace(/[^A-Za-zÀ-ÿ' -]/g,' ').trim();
   const words=cleaned.split(/\s+/).filter(Boolean);
   if(words.length && /^[A-Za-zÀ-ÿ'-]+$/.test(words[0])) first=words[0];
 }
 return {username:handle,displayName:display,firstName:first,email};
}
function addResult(name,text,d){
 const el=document.createElement('div');el.className='card';el.style.marginTop='14px';
 el.innerHTML=`<div class="muted">${esc(name)}</div>
 <div class="row">
 <div class="field"><label>Username</label><input value="${escAttr(d.username)}"></div>
 <div class="field"><label>First name</label><input value="${escAttr(d.firstName)}"></div>
 <div class="field"><label>Email</label><input value="${escAttr(d.email)}"></div>
 </div>
 <details style="margin-top:14px"><summary>Raw OCR text</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(text)}</pre></details>`;
 results.appendChild(el);
}
function addError(n,e){const el=document.createElement('div');el.className='empty';el.textContent=`${n}: ${e}`;results.appendChild(el);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return esc(s);}
</script>
</body>
</html>
